<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nigeria Crime Intel Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        h1 { color: #1a1a1a; }
        .stats { margin-bottom: 20px; color: #555; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #1a1a1a; color: white; }
        .robbery { color: #b30000; font-weight: bold; }
        .kidnapping { color: #b35c00; font-weight: bold; }
        .confidence-high { color: green; }
        .confidence-medium { color: orange; }
        .confidence-low { color: gray; }
    </style>
</head>
<body>
    <h1>Nigeria Crime Intelligence Tracker</h1>
    <div class="stats">{{ count }} incidents recorded</div>

    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Crime Type</th>
            <th>Location</th>
            <th>Confidence</th>
            <th>Summary</th>
            <th>Date Added</th>
        </tr>
        {% for row in incidents %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td class="{{ row[2] }}">{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td class="confidence-{{ row[4] }}">{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
            <td>{{ row[6] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
